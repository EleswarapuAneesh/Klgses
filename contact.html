<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - KLG-SES</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav>
      <div class="left">
        <img src="logo.jpg" alt="Logo">
        <div class="text">KLG Scientific & Electronic Services</div>
      </div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact us</a></li>
      </ul>
    </nav>
  </header>

  <main class="contact-container">
    <h2>Contact Us</h2>
    <form id="contact-form">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </main>

  <footer>
    © 2025 <span>KLG Scientific & Electronic Services</span> — All Rights Reserved
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const form = document.getElementById("contact-form");

      form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const formData = {
          name: form.name.value,
          email: form.email.value,
          message: form.message.value
        };

        try {
          const response = await fetch("https://klgses.onrender.com/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
          });

          const data = await response.json();

          if (response.ok) {
            showPopup("Thank you for your message! We’ll reach you shortly.");
            form.reset();
          } else {
            showPopup("Something went wrong: " + data.error);
          }
        } catch (error) {
          showPopup("⚠️ Error sending message. Please try again later.");
          console.error(error);
        }
      });

      // Popup function
      function showPopup(message) {
        const popup = document.createElement("div");
        popup.textContent = message;
        popup.style.position = "fixed";
        popup.style.top = "20px";
        popup.style.right = "20px";
        popup.style.background = "#222";
        popup.style.color = "#fff";
        popup.style.padding = "12px 20px";
        popup.style.borderRadius = "8px";
        popup.style.boxShadow = "0 2px 10px rgba(0,0,0,0.3)";
        popup.style.zIndex = "1000";
        popup.style.transition = "opacity 0.5s";
        document.body.appendChild(popup);

        setTimeout(() => {
          popup.style.opacity = "0";
          setTimeout(() => popup.remove(), 500);
        }, 3000);
      }
    });
  </script>
</body>

</html>
